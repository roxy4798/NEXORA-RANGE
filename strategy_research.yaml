# NEXORA RANGE SCANNER — Strategy Research Configuration
# All research filters default to false to preserve the raw baseline detector.
# DO NOT enable live trading. System must remain in PAPER mode.

general:
  strategy_mode: "PAPER" # PAPER | BACKTEST
  universe:
    - "BTCUSDT"
    - "ETHUSDT"
    - "BNBUSDT"
    - "SOLUSDT"
    - "XRPUSDT"
    - "DOGEUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
    - "LINKUSDT"
    - "SUIUSDT"
  timeframes:
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"

# ----------------------------------------------------
# RESEARCH FILTERS (Independent Filter Layers)
# ----------------------------------------------------

# Filter A: EMA Trend Alignment
enable_trend_filter: false
trend_filter:
  mode: "ema200" # "ema200" | "ema50_200" | "ema200_slope"
  ema_fast_length: 50
  ema_slow_length: 200
  slope_bars: 5

# Filter B: Higher Timeframe (HTF) Trend Alignment
enable_htf_filter: false
htf_filter:
  tf_15m_htf: "1h" # HTF for 15m
  tf_1h_htf: "4h"  # HTF for 1h
  htf_ema_length: 200

# Filter C: Breakout Volume Confirmation
enable_volume_filter: false
volume_filter:
  sma_length: 20
  multiplier_threshold: 1.2 # 1.0x | 1.2x | 1.5x | 2.0x

# Filter D: ATR Volatility Regime
enable_atr_filter: false
atr_filter:
  sma_length: 20
  regime: "expansion" # "expansion" (ATR > ATR_SMA) | "contraction" (ATR < ATR_SMA)

# Filter E: Breakout Distance / Strength
enable_breakout_strength_filter: false
breakout_strength_filter:
  min_distance_atr: 0.25 # 0.15 | 0.25 | 0.50 | 0.75 | 1.00

# Filter F: Breakout Candle Quality
enable_candle_filter: false
candle_filter:
  min_body_ratio: 0.50 # body / range
  min_close_location: 0.70 # close location value (0.0 - 1.0)
  require_direction_match: true # close > open for long, close < open for short

# Filter G: Range Quality Filter
enable_range_quality_filter: false
range_quality_filter:
  min_range_duration_bars: 15
  min_compression_rank: 20.0
  min_touch_count: 2
  min_containment: 0.80

# Filter H: Retest & Continuation Confirmation
enable_retest_filter: false
retest_filter:
  max_wait_bars: 10
  retest_buffer_atr: 0.30
  require_continuation_candle: true

# Filter I: Deviation Setup (Failed Breakout Reversal)
enable_deviation_strategy: false
deviation_strategy:
  target_model: "opposite_boundary" # "opposite_boundary" | "midline"
  max_bars_outside: 8
